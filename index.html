<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DU3 Photo App (DEV)</title>
<style>
:root{--red:#E5232A;--ink:#2A2F2F;--grey:#3D4345;--blue:#1F4E79;--line:#D9DCDD;--ok:#1E7B3A;--na:#B7791F;--bad:#C0262D;--bg:#FFFFFF;--soft:#F4F5F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:18px}
header{padding:12px 16px 0}
header img{height:31px;display:block}
.title{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;margin:8px 0 2px}
.title .du3{color:var(--red)} .title .sub{color:var(--grey);font-weight:400}
.rule{height:3px;background:var(--red);margin:8px 0 0}
.ribbon{background:#FFF1E6;color:#9A4A00;font:700 12px Arial,sans-serif;padding:6px 16px;letter-spacing:.3px}
main{padding:14px 16px 170px}
h2{font:700 15px Arial,sans-serif;color:var(--blue);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.4px}
.big{display:block;width:100%;min-height:88px;margin:12px 0;border:0;border-radius:16px;background:var(--ink);color:#fff;font:700 23px Arial,sans-serif;padding:18px 20px;text-align:left}
.big small{display:block;font:400 16px Arial,sans-serif;opacity:.8;margin-top:4px}
.big.red{background:var(--red)} label.big{display:flex;align-items:center;justify-content:center} .big.light{background:var(--soft);color:var(--ink);border:2px solid var(--line)}
table.hdr{width:100%;border-collapse:collapse;font:16px "Courier New",monospace}
table.hdr td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
table.hdr td:first-child{color:#2F3436;font-weight:700;width:42%}
.note{font-size:16px;color:#2F3436;line-height:1.4}
.meta{font:700 16px Arial,sans-serif;color:var(--grey);display:flex;justify-content:space-between;gap:8px}
.ref{color:var(--blue)}
.prompt{font:700 27px/1.25 Arial,sans-serif;margin:10px 0 6px}
.tip{font-size:18px;color:#1F2426;margin-bottom:14px;line-height:1.35}
.seg{display:flex;gap:10px;margin:12px 0}
.seg button{flex:1;min-height:80px;border-radius:16px;border:3px solid var(--line);background:#fff;font:700 21px Arial,sans-serif;color:var(--ink)}
.seg button.on.p{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.f{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.n{background:var(--na);border-color:var(--na);color:#fff}
.seg button.on.d{background:var(--ok);border-color:var(--ok);color:#fff}
.grp{border-top:1px solid var(--line)}
.grp .row{padding:10px 0;border-bottom:1px solid var(--line)}
.grp .row .lbl{font-size:19px;color:#111;font-weight:600;margin-bottom:8px}
.grp .seg{margin:4px 0}.grp .seg button{min-height:64px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0}
.cell{position:relative}.cell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid var(--line);display:block}
.cell .del{position:absolute;top:6px;right:6px;width:56px;height:56px;border-radius:28px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px}
.cell .num{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font:700 13px Arial;padding:2px 8px;border-radius:10px}
.cell .up{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;font:700 13px Arial;padding:3px 8px;border-radius:10px}.cell .up.ok{background:#1E7B3A}.cell .up.fail{background:#B7791F}
.cell .badge{position:absolute;top:6px;left:6px;background:var(--blue);color:#fff;font:700 11px Arial;padding:3px 7px;border-radius:6px}
.shot{width:100%;border-radius:12px;border:2px solid var(--line);display:block;margin:8px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
input[type=text],input[type=number],textarea{width:100%;font:700 26px "Courier New",monospace;padding:18px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{font:18px Arial,sans-serif;min-height:84px}
.chip{display:inline-block;font:700 16px Arial,sans-serif;padding:6px 12px;border-radius:20px;margin:8px 6px 0 0}
.chip.p{background:#E3F2E7;color:var(--ok)}.chip.f{background:#FBE4E5;color:var(--bad)}.chip.n{background:#FFF3DF;color:var(--na)}.chip.g{background:#E3E6E7;color:#1F2426}
.notebar{display:flex;gap:8px;margin-top:14px;align-items:flex-start}
.notebar textarea{flex:1}
.mic{width:88px;min-height:84px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:34px}
.mic.live{background:var(--red);border-color:var(--red)}
.sigbox{border:2px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.sigbox .lbl{font-size:18px;margin-bottom:8px}
.pad{width:100%;height:150px;border:3px dashed var(--blue);border-radius:12px;background:#FAFBFC;margin-top:10px;touch-action:none;display:block}
.sigimg{width:100%;max-height:150px;object-fit:contain;border-bottom:2px solid var(--ink)}
.lockbar{background:var(--ink);color:#fff;font:700 17px Arial;padding:12px;border-radius:12px;margin-bottom:10px}
.ro .seg button,.ro input,.ro textarea,.ro .del,.ro .shoot,.ro .mic{pointer-events:none;opacity:.55}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlgbox{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.dlgmsg{font:700 21px/1.35 Arial,sans-serif;margin-bottom:8px}
.dlgbox img{width:100%;border-radius:10px;margin:6px 0}
.shoot{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.shoot input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:200px;cursor:pointer}
.dobox{background:#F1F5FA;border-left:6px solid var(--blue);border-radius:10px;padding:12px 14px;margin:10px 0 12px}
.dohead{font:700 15px Arial;color:var(--blue);letter-spacing:.5px}
.dobox ol{margin:6px 0 0 22px;padding:0}.dobox li{font:19px/1.4 Arial,sans-serif;color:#111;margin:6px 0}
.src{font:14px Arial;color:#2F3436;margin-top:8px}
.shotp{font:700 19px/1.35 Arial,sans-serif;color:#111;background:#FFF4E5;border-radius:10px;padding:10px 12px;margin:8px 0}
.gate{border:2px solid var(--blue);border-radius:12px;padding:12px;margin:10px 0;background:#F1F5FA}
.gate b{color:var(--blue);font-family:Arial,sans-serif}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.strip{display:flex;gap:3px;margin-bottom:8px;overflow:hidden}
.strip i{flex:1;height:12px;border-radius:3px;background:var(--line)}
.strip i.p{background:var(--ok)}.strip i.f{background:var(--bad)}.strip i.n{background:var(--na)}.strip i.cur{outline:2px solid var(--ink);outline-offset:1px}
.navbtns{display:flex;gap:8px}
.navbtns button{flex:1;min-height:76px;border:0;border-radius:16px;font:700 21px Arial,sans-serif;background:var(--soft);color:var(--ink)}
.navbtns .go{background:var(--ink);color:#fff;flex:1.4}
.navbtns .x{flex:.8;background:#fff;border:2px solid var(--line)}
.miss li{margin:6px 0}
.form h3{font:700 14px Arial,sans-serif;color:var(--blue);margin:16px 0 4px;border-bottom:2px solid var(--blue);padding-bottom:3px}
.form table{width:100%;border-collapse:collapse;font:13px "Courier New",monospace}
.form td{border:1px solid var(--line);padding:5px;vertical-align:top}
.form td.r{width:70px;text-align:center;font-weight:700}
.tag{font:700 11px Arial,sans-serif;color:#fff;background:var(--blue);padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
footer{margin-top:30px;border-top:3px solid var(--red);padding-top:8px;font-size:12px;color:var(--grey)}
footer b{color:var(--ink);font-family:Arial,sans-serif}
label.cb{display:flex;gap:14px;align-items:center;font:19px Arial,sans-serif;padding:18px 0;min-height:72px;border-bottom:1px solid var(--line)}
label.cb input{width:34px;height:34px}
.speak.live{background:var(--red);color:#fff;border-color:var(--red)}
.ro .speak{pointer-events:none;opacity:.55}
#side{display:none}

 body.wide header,body.wide .ribbon,body.wide main{max-width:860px;margin-left:auto;margin-right:auto}
 body.wide main{padding-bottom:130px}
 body.wide .grid{grid-template-columns:repeat(4,1fr)}
 body.wide.stepping header,body.wide.stepping .ribbon,body.wide.stepping main{margin-left:calc(var(--sideW,50vw) + 22px);margin-right:24px;max-width:none}
 body.wide.stepping nav.bar{left:var(--sideW,50vw)}
 #side{display:none}
 body.wide.stepping #side{display:block;position:fixed;left:0;top:0;bottom:0;width:var(--sideW,50vw);overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:16px 16px 24px;font-size:18px;z-index:20}
 #side h4{margin:16px 0 6px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--blue)}
 #side .si{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink);line-height:1.3}
 #side .si:hover{background:#F2F4F5}
 #side .si.cur{background:#FDE8E9;outline:2px solid var(--red)}
 #side .ic{flex:none;width:20px;text-align:center;font-weight:700}
 #side .ic.p{color:#1E7B34}#side .ic.f{color:#C0262D}#side .ic.n{color:#6B7173}#side .ic.m{color:#B0B5B7}
 #side .top{font-weight:700;font-size:21px}
 #side .note{font-size:15px}
 #side .si{padding:8px 10px}
 #side .keys{margin-top:14px;font-size:12px;color:var(--grey);line-height:1.6;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
 #side kbd{border:1px solid #C9CDCF;border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px monospace;background:#F7F8F8}
 #side button.fin{width:100%;margin-top:10px;padding:10px;font-size:16px;font-weight:700;border:0;border-radius:8px;background:var(--red);color:#fff;cursor:pointer}
 body.dragging main{outline:4px dashed var(--red);outline-offset:-6px}
.edge{display:none;position:fixed;top:46%;transform:translateY(-50%);width:40px;height:130px;border:0;padding:0;background:rgba(31,42,68,.30);color:#fff;font:700 46px/1 Arial,sans-serif;z-index:15;opacity:.9;transition:opacity .6s,background .15s;-webkit-tap-highlight-color:transparent}
.edge.l{left:0;border-radius:0 16px 16px 0}.edge.r{right:0;border-radius:16px 0 0 16px}
.edge:active{opacity:1;background:rgba(229,35,42,.9)}
body.showedge .edge{display:block}body.showedge .edge.off{display:none}
body.showedge main{padding-left:46px;padding-right:46px}
body.edgeidle .edge{opacity:.35}
main{touch-action:pan-y}
.big{min-height:58px;margin:8px 0;border-radius:12px;font-size:19px;padding:10px 16px}
.big small{font-size:14px;margin-top:2px}
.seg{gap:8px}.seg button{min-height:50px;font-size:17px;border-radius:12px;border-width:2px}
.navbtns button{min-height:54px;font-size:18px;border-radius:12px}
input[type=text],input[type=number]{font-size:20px;padding:12px}
textarea{min-height:64px;padding:12px;font-size:17px}
.cb{min-height:48px;padding:10px 0;font-size:17px}.cb input{width:26px;height:26px}
.dobox li{font-size:17px}
.cell .del,.del{width:42px;height:42px;font-size:17px}
.edge{height:110px;width:36px;font-size:40px}
body.showedge main{padding-left:42px;padding-right:42px}
body.wide .big{min-height:44px;font-size:16px;padding:8px 14px;margin:6px 0}
body.wide .big small{font-size:13px}
body.wide .seg button{min-height:40px;font-size:15px}
body.wide .navbtns button{min-height:44px;font-size:16px}
body.wide input[type=text],body.wide input[type=number]{font-size:17px;padding:8px}
body.wide textarea{font-size:15px;min-height:56px}
body.wide .cb{min-height:40px;font-size:15px}
body.wide .dobox li{font-size:15px}
body.wide .big.shoot{min-height:44px!important;font-size:16px!important}
#split{display:none;position:fixed;top:0;bottom:0;width:12px;margin-left:-6px;left:var(--sideW,50vw);cursor:col-resize;z-index:25;touch-action:none}
#split::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
#split:hover::after,#split.drag::after{background:var(--red);width:4px;left:4px}
#split span{position:absolute;top:50%;left:1px;transform:translateY(-50%);width:10px;height:44px;border-radius:5px;background:#C9CDCF}
#split:hover span,#split.drag span{background:var(--red)}
body.wide.stepping #split{display:block}
body.splitting,body.splitting *{cursor:col-resize!important;user-select:none!important}
body.wide.stepping main{font-size:20px}
body.wide.stepping .meta{font-size:18px}
body.wide.stepping .prompt{font-size:34px;line-height:1.2}
body.wide.stepping .dohead{font-size:17px}
body.wide.stepping .dobox li{font-size:20px;line-height:1.45}
body.wide.stepping .src{font-size:16px}
body.wide.stepping .shotp{font-size:22px}
body.wide.stepping .tip{font-size:20px}
body.wide.stepping .note{font-size:18px}
body.wide.stepping .lbl{font-size:19px}
body.wide.stepping .chip{font-size:17px}
body.wide.stepping .big,body.wide.stepping .big.shoot{min-height:52px!important;font-size:20px!important;padding:10px 16px}
body.wide.stepping .seg button{min-height:50px;font-size:19px}
body.wide.stepping .cb{font-size:19px;min-height:48px}
body.wide.stepping textarea{font-size:19px;min-height:70px}
body.wide.stepping input[type=text],body.wide.stepping input[type=number]{font-size:21px;padding:10px}
body.wide.stepping .navbtns button{min-height:50px;font-size:19px}
body.wide.stepping .hdr{font-size:18px}
</style>
</head>

 const ans={};Object.keys(S.ans).forEach(id=>{const a=Object.assign({},S.ans[id]);a.photos=(a.photos||[]).map(p=>({uid:p.uid,mime:p.mime,fileName:p.fileName,takenMs:p.takenMs,taken:p.taken,up:p.up==="busy"?"wait":p.up,n:p.n,lineId:p.line&&p.line.id,fileId:p.fileId,photoId:p.photoId,url:p.url,hasCrop:!!p.crop}));ans[id]=a});
 try{localStorage.setItem(k,JSON.stringify({i:S.i,crop:S.crop,extras:S.extras,ans,savedAt:S.savedAt||""}));localStorage.setItem("du3cur",JSON.stringify({job:JOB["Job ID"],mode:S.mode}))}catch(e){}}
function clearSaved(){const k=saveKey();if(!k)return;try{const s=JSON.parse(localStorage.getItem(k)||"null");if(s)Object.values(s.ans).forEach(a=>(a.photos||[]).forEach(p=>idbDel(p.uid)));localStorage.removeItem(k);localStorage.removeItem("du3cur")}catch(e){}}
function restore(){const k=saveKey();let s=null;try{s=JSON.parse(localStorage.getItem(k)||"null")}catch(e){}if(!s)return false;
 S.extras=s.extras||[];S.crop=!!s.crop;S.ans=s.ans||{};S.savedAt=s.savedAt||"";const L=lines();const byId={};L.forEach(l=>byId[l.id]=l);
 const loads=[];Object.values(S.ans).forEach(a=>(a.photos||[]).forEach(p=>{p.line=byId[p.lineId]||{id:p.lineId,p:p.lineId};loads.push(idbGet(p.uid).then(v=>{if(v){p.src=v.src;p.crop=v.crop}}))}));
 $("sub").textContent="· "+MODES[S.mode].name;step(Math.min(s.i||0,L.length-1));
 Promise.all(loads).then(()=>{let lost=0;Object.values(S.ans).forEach(a=>(a.photos||[]).forEach(p=>{if(!p.src&&p.up!=="ok")lost++}));render();pump();
  if(lost)tell(lost+" photo(s) taken earlier are no longer on this phone and were not uploaded. Please retake them.")});
 return true}
function resumeCur(){let c=null;try{c=JSON.parse(localStorage.getItem("du3cur")||"null")}catch(e){}if(!c)return false;if(c.mode==="WO"){openWO(c.job);return true}const k=JOBS.findIndex(J=>J["Job ID"]===c.job);if(k<0)return false;
 JOB=JOBS[k];busy("Picking up where you left off…");loadMode(c.mode);return true}
function purgeClosed(){const open={};JOBS.forEach(J=>open[J["Job ID"]]=1);let kept=0;
 try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("du3job|")===0)ks.push(k)}
  ks.forEach(k=>{const id=k.split("|")[1];if(open[id])return;if(/^WO-/.test(id)&&(!WOS||WOS.indexOf(id)>=0))return;let s=null;try{s=JSON.parse(localStorage.getItem(k)||"null")}catch(e){}
   const waiting=s?Object.values(s.ans||{}).some(a=>(a.photos||[]).some(p=>p.up!=="ok")):false;
   if(waiting){kept++;return}
   if(s)Object.values(s.ans||{}).forEach(a=>(a.photos||[]).forEach(p=>idbDel(p.uid)));localStorage.removeItem(k)});
  const c=JSON.parse(localStorage.getItem("du3cur")||"null");if(c&&!open[c.job]&&!(c.mode==="WO"&&(!WOS||WOS.indexOf(c.job)>=0)))localStorage.removeItem("du3cur")}catch(e){}
 if(kept)setTimeout(()=>tell(kept+" closed job(s) still have photos on this phone that never uploaded. They are kept. Call L3Harris:DU3."),500)}
async function openWO(id){busy("Opening work order "+id+"…");
 try{const r=await call("apiWorkOrder",PIN,id);JOB=r.job;VERSION=r.version;const c=r.contact||{};
  const hdr=[["Work order",JOB["Job ID"]+(JOB["Rev"]?" · Rev "+JOB["Rev"]:"")],["Issued to",JOB["Issued to"]],["Unit",JOB["Unit"]+" · "+JOB["Vehicle"]],["VCH serial",JOB["VCH serial"]],["Vehicle contact",(c.b10||"")+(c.phone?" · "+c.phone:"")]].filter(x=>x[1]&&String(x[1]).trim());
  MODES.WO={name:"Work order",title:"Work order "+JOB["Job ID"],form:"DU3 Work Order "+JOB["Job ID"]+" · Returned "+JOB["Issued to"],header:hdr,phone:c.phone||"",lines:r.steps.map(rowToLine)};job("WO")}
 catch(e){tell("Couldn't open work order "+id+": "+(e.message||e)+". No connection? Use the paper work order form.");home()}}
function startOver(){ask("Start this job again from the first step? Answers and photos not yet uploaded are cleared from this phone. Uploaded photos stay in Drive.","Start over",()=>{clearSaved();job(S.mode)})}
var _render0=render;render=function(){_render0();persist();if(_rec){const b=$("mic"),s=$("micsub");if(b)b.classList.add("live");if(s)s.textContent="Listening. Tap again to stop."}};
var _rb0=refreshBadges;refreshBadges=function(){_rb0();persist()};
document.addEventListener("input",persist);
var _f0=finish;finish=function(){_f0();$("app").insertAdjacentHTML("beforeend",'<button class="big light" onclick="startOver()">Start this job over</button>')};document.addEventListener("change",persist);
function hasMouse(){try{return window.matchMedia("(any-pointer:fine)").matches&&!window.matchMedia("(pointer:coarse)").matches}catch(e){return false}}
function isWide(){return hasMouse()&&window.innerWidth>=900}
function isImg(f){return f&&String(f.type).indexOf("image")===0}
function snapMany(fs){[...(fs||[])].filter(isImg).forEach(f=>snap({files:[f]}))}
function takesPhotos(l){return l&&(l.t==="photo"||(l.t==="gate"&&l.photo)||(l.t==="field"&&l.ocr))}
function addFiles(fs){const l=lines()[S.i];if(!takesPhotos(l)){tell("This step doesn't take photos. Go to a photo step first.");return}
 const im=[...(fs||[])].filter(isImg);if(!im.length)return;
 if(l.t==="field")ocrSnap({files:[im[0]]});else im.forEach(f=>snap({files:[f]}))}
function side(){const w=isWide(),on=w&&S.screen==="step"&&MODES[S.mode];document.body.classList.toggle("wide",w);document.body.classList.toggle("stepping",!!on);
 const el=$("side");if(!el)return;if(!on){el.innerHTML="";return}
 const L=lines(),M=MODES[S.mode];let sec=null,out="",done=0;
 L.forEach((l,i)=>{const s=status(l);if(s)done++;if(l.sec!==sec){sec=l.sec;out+=`<h4>${esc(sec||"")}</h4>`}
  const ic=s==="p"?"✓":s==="f"?"✗":s==="n"?"–":"○",cl=s||"m";
  out+=`<div class="si${i===S.i?" cur":""}" onclick="step(${i})"><span class="ic ${cl}">${ic}</span><span>${esc(l.id)} · ${esc(l.p)}</span></div>`});
 el.innerHTML=`<div class="top">${esc(M.title)}</div><div class="note">${esc(JOB["Job ID"]||"")} · ${done} of ${L.length} done · <span id="upq2">${esc(queueText())}</span></div>${out}
 <button class="fin" onclick="finish()">Finish ▶</button>
 <div class="keys"><kbd>→</kbd> <kbd>←</kbd> next / back · <kbd>D</kbd> done · <kbd>P</kbd> pass · <kbd>F</kbd> fail · <kbd>N</kbd> N/A<br>Photos: drag files onto the page, or paste a screenshot with <kbd>Ctrl</kbd>+<kbd>V</kbd> (Windows: <kbd>Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> to snip).</div>`;
 const c=el.querySelector(".si.cur");if(c&&c.scrollIntoView)c.scrollIntoView({block:"nearest"})}
function edges(){const fin=S.screen==="finish",on=(S.screen==="step"||fin)&&!isWide()&&!!MODES[S.mode];document.body.classList.toggle("showedge",on);if(!on)return;
 const L=$("edgeL"),R=$("edgeR");if(L)L.classList.toggle("off",!fin&&S.i===0);if(R)R.classList.toggle("off",fin);if(fin){edgeWake();return}if(R)R.textContent=S.i===lines().length-1?"✓":"›";edgeWake()}
let _et=null;function edgeWake(){document.body.classList.remove("edgeidle");clearTimeout(_et);_et=setTimeout(()=>document.body.classList.add("edgeidle"),3000)}
document.addEventListener("touchstart",()=>{if(document.body.classList.contains("showedge"))edgeWake()},{passive:true});
document.addEventListener("scroll",()=>{if(document.body.classList.contains("showedge"))edgeWake()},{passive:true});
var _side0=side;side=function(){_side0();edges()};
let sideF=0.5;try{const v=parseFloat(localStorage.getItem("du3sideF"));if(v>0.15&&v<0.85)sideF=v}catch(e){}
function applySide(){const w=window.innerWidth,px=Math.max(240,Math.min(w-380,Math.round(w*sideF)));document.documentElement.style.setProperty("--sideW",px+"px")}
applySide();window.addEventListener("resize",applySide);
(function(){const sp=$("split");if(!sp)return;let on=false;
 sp.addEventListener("pointerdown",e=>{on=true;sp.classList.add("drag");document.body.classList.add("splitting");try{sp.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
 sp.addEventListener("pointermove",e=>{if(!on)return;sideF=Math.max(0.15,Math.min(0.85,e.clientX/window.innerWidth));applySide()});
 const end=()=>{if(!on)return;on=false;sp.classList.remove("drag");document.body.classList.remove("splitting");try{localStorage.setItem("du3sideF",String(sideF))}catch(x){}};
 sp.addEventListener("pointerup",end);sp.addEventListener("pointercancel",end);
 sp.addEventListener("dblclick",()=>{sideF=0.5;applySide();try{localStorage.setItem("du3sideF","0.5")}catch(x){}})})();
function goHome(){if(!ME)return;if(_rec)try{_rec.stop()}catch(e){}
 if(S.mode==="WO"&&MODES.WO){S.screen="job";job("WO");return}
 const k=JOB?JOBS.indexOf(JOB):-1;if(k>=0)pickJob(k);else home();window.scrollTo(0,0)}
(function(){const im=document.querySelector("header img");if(!im)return;im.style.cursor="pointer";im.title="Home";im.setAttribute("role","button");im.setAttribute("aria-label","Home");im.addEventListener("click",goHome)})();
var _render2=render;render=function(){_render2();side()};
try{new MutationObserver(()=>side()).observe($("app"),{childList:true})}catch(e){}
window.addEventListener("resize",()=>side());
document.addEventListener("keydown",e=>{if(S.screen!=="step"||e.ctrlKey||e.metaKey||e.altKey)return;
 const t=e.target;if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;const d=$("dlg");if(d&&d.style.display!=="none"&&d.offsetParent!==null)return;
 const l=lines()[S.i],k=e.key;
 if(k==="ArrowRight"||k==="PageDown"){go(1);e.preventDefault()}
 else if(k==="ArrowLeft"||k==="PageUp"){go(-1);e.preventDefault()}
 else if((k==="d"||k==="D")&&l.t==="check")pick("done")
 else if((k==="p"||k==="P")&&l.t==="pf")pick("P")
 else if((k==="f"||k==="F")&&l.t==="pf")pick("F")
 else if(k==="n"||k==="N"){if(l.t==="photo")setNA();else if(l.t==="check"||l.t==="pf")pick("na")}});
let _dragN=0;
document.addEventListener("dragenter",e=>{if(S.screen!=="step")return;_dragN++;document.body.classList.add("dragging");e.preventDefault()});
document.addEventListener("dragleave",()=>{if(--_dragN<=0){_dragN=0;document.body.classList.remove("dragging")}});
document.addEventListener("dragover",e=>{if(S.screen==="step")e.preventDefault()});
document.addEventListener("drop",e=>{_dragN=0;document.body.classList.remove("dragging");if(S.screen!=="step")return;e.preventDefault();addFiles(e.dataTransfer&&e.dataTransfer.files)});
document.addEventListener("paste",e=>{if(S.screen!=="step")return;const t=e.target;if(t&&/INPUT|TEXTAREA/.test(t.tagName))return;
 const fs=[...((e.clipboardData&&e.clipboardData.items)||[])].filter(x=>x.kind==="file").map(x=>x.getAsFile()).filter(Boolean);
 if(fs.length){e.preventDefault();addFiles(fs)}});
var _rb2=refreshBadges;refreshBadges=function(){_rb2();const q=$("upq2");if(q)q.textContent=queueText()};
try{PIN=localStorage.getItem("du3pin")||""}catch(e){}
if(PIN)login();else pinScreen();
